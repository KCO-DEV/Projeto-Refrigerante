<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />

    <!-- RESPONSIVO (importante) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Projeto Refri</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main>

        <!-- MORANGO -->
        <div class="item active" style="--background:#EA3D41;">
            <div class="title">Morango</div>

            <img src="img/Morango-refrigerante-foregroundBlur.png"
                class="fruit"
                alt="Fruta morango fundo">

            <img src="img/Morango-refrigerante.png"
                class="refri"
                alt="Refrigerante de morango">
        </div>


        <!-- ABACATE -->
        <div class="item" style="--background:#2D5643;">
            <div class="title">Abacate</div>

            <img src="img/Abacate-refrigerante-foregroundBlur.png"
                class="fruit"
                alt="Fruta abacate fundo">

            <img src="img/Abacate-refrigerante.png"
                class="refri"
                alt="Refrigerante de abacate">
        </div>


        <!-- LARANJA -->
        <div class="item" style="--background:#E7A043;">
            <div class="title">Laranja</div>

            <img src="img/Laranja-refrigerante-foregroundBlur.png"
                class="fruit"
                alt="Fruta laranja fundo">

            <img src="img/Laranja-refrigerante.png"
                class="refri"
                alt="Refrigerante de laranja">
        </div>


        <!-- SETAS -->
        <div class="arrow">
            <button id="prev">&#8249;</button>
            <button id="next">&#8250;</button>
        </div>

    </main>

    <!-- SCRIPT SEMPRE NO FINAL -->
    <script src="scripts.js"></script>

</body>
</html>
